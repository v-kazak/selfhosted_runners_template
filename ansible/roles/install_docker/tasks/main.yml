- name: Собираем факты о системе
  ansible.builtin.setup: #Отдельная таска, т.к  gather_facts: false (он выполняется самым первым, до таски сожиданием доступности)

- name: Устанавливаем зависимости для Docker и sudo
  ansible.builtin.apt:
    name:
      - sudo
      - ca-certificates
      - curl
      - gnupg
      - lsb-release
      - acl
    state: present
    update_cache: true

- name: Создаем директорию для ключей apt
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'

- name: Добавляем GPG ключ Docker
  ansible.builtin.get_url:
    url: "{{ docker_gpg_url }}"
    dest: /etc/apt/keyrings/docker.asc
    mode: '0644'

- name: Добавляем репозиторий Docker
  ansible.builtin.apt_repository:
    repo: "{{ docker_repo_string }}"
    state: present
    filename: docker

- name: Устанавливаем Docker Engine
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
      - python3-docker
    state: present
    update_cache: true

- name: Убедимся, что сервис Docker запущен и включен при загрузке
  ansible.builtin.service:
    name: docker
    state: started
    enabled: true

- name: Создаём группу runner
  ansible.builtin.group:
    name: runner
    state: present

- name: Создаём пользователя runner
  ansible.builtin.user:
    name: runner
    state: present
    shell: /bin/bash
    create_home: true
    groups:
      - sudo
      - docker
      - runner
    append: true

- name: Кладём публичный ключ в authorized_keys для пользователя runner
  ansible.posix.authorized_key:
    user: runner
    state: present
    key: "{{ lookup('file', lookup('env', 'HOME') + '/.ssh/id_ed25519.pub') }}"

- name: Настраиваем беспарольный sudo для пользователя runner
  ansible.builtin.copy:
    dest: /etc/sudoers.d/runner
    content: 'runner ALL=(ALL) NOPASSWD: ALL'
    mode: '0440'
    validate: '/usr/sbin/visudo -cf %s'

- name: Запрещаем вход по паролю для всех пользователей
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^#?\s*PasswordAuthentication'
    line: 'PasswordAuthentication no'
    backup: true
    validate: '/usr/sbin/sshd -t -f %s'
  notify: restart ssh
  
